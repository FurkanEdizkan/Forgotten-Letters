# ============================================================
# Forgotten Letters — local development stack
#
# Full local parity for every cloud service the app uses in prod:
#   MinIO   stands in for Cloudflare R2 (both S3-compatible)
#   Mailpit stands in for Amazon SES    (both plain SMTP)
# The same @aws-sdk/client-s3 and nodemailer code runs in both
# environments — only env vars differ. See docs/BuildPlan.md §A1.
#
# This is the DEV stack. The prod-shaped stack is the root
# docker-compose.yml, which builds the real standalone image.
# ============================================================

name: forgotten-letters-dev

services:
  # ── Dev box (the container VS Code attaches to) ─────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/workspace:cached
    working_dir: /workspace
    # Keep the box alive; VS Code execs into it. Overrides the
    # image's ENTRYPOINT so the dev container never exits.
    command: sleep infinity
    environment:
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started

  # ── PostgreSQL (prod: same, on Lightsail or RDS) ────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgotten
      POSTGRES_PASSWORD: forgotten
      POSTGRES_DB: forgotten_letters
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # -d/-U are required; a bare pg_isready passes before the
      # init scripts finish and the app then races the DB.
      test: ["CMD-SHELL", "pg_isready -U forgotten -d forgotten_letters"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MinIO — local stand-in for Cloudflare R2 ────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── One-shot: create the buckets the app expects ────────────
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # Assets are public-read because they are served through a
    # Cloudflare custom domain in prod. Avatars stay private and
    # are read via presigned URLs.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/forgotten-letters-assets &&
      mc mb --ignore-existing local/forgotten-letters-avatars &&
      mc anonymous set download local/forgotten-letters-assets &&
      echo 'MinIO buckets ready.'
      "

  # ── Mailpit — local stand-in for Amazon SES ─────────────────
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI — read verification emails here

volumes:
  pgdata:
  miniodata:
