version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch/minor bumps land as one PR to keep review volume sane;
      # majors stay separate so breaking changes get real scrutiny.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Pinned deliberately — next-auth v5 peers an older nodemailer that
      # carries unpatched SMTP-injection advisories. See package.json.
      - dependency-name: nodemailer
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/design-lab"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
