name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  check:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check

  test:
    name: Unit and service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Testcontainers starts postgres:18 on the runner's Docker.
      - run: npm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The app runs on its own throwaway postgres:18 (e2e/server.js).
      - run: npm run e2e

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm audit --omit=dev --audit-level=high

  atlas:
    name: Atlas check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tools/atlas/package-lock.json
      - run: npm ci
        working-directory: tools/atlas
      - run: npm run check -- --strict
        working-directory: tools/atlas

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Settings for the test
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "ORIGIN=http://localhost:3000"
          } > .env
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Wait for /health/ready
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/health/ready && exit 0
            sleep 2
          done
          exit 1
      - name: Setup link is logged
        run: docker compose logs app | grep -q '/setup/'
      - name: Backup tools are PostgreSQL 18
        run: docker compose exec -T app pg_dump --version | grep -q ' 18\.'
      - name: Logs
        if: failure()
        run: docker compose logs
      - name: Stop
        if: always()
        run: docker compose down -v
