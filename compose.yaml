# Forgotten Letters: the app and its database (and Caddy for HTTPS with the `https` profile).
# Settings live in .env next to this file (copy .env.example). Start: docker compose up -d
# HTTPS: set DOMAIN (and ORIGIN=https://<DOMAIN>), then docker compose --profile https up -d
name: forgotten-letters
services:
  app:
    build: ./app
    image: ghcr.io/furkanedizkan/forgotten-letters:latest
    env_file: .env
    init: true
    read_only: true
    tmpfs: [/tmp]
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - backups:/data/backups
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 10s
      timeout: 3s
      start_period: 60s
      retries: 3
    stop_grace_period: 30s
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-letters}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-letters}
    init: true
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    # Time for a clean checkpoint on shutdown.
    stop_grace_period: 60s
    restart: unless-stopped

  caddy:
    image: caddy:2
    profiles: [https]
    environment:
      DOMAIN: ${DOMAIN:-}
    init: true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  backups:
  uploads:
  caddy_data:
  caddy_config:
